services:
  - type: web
    name: ai-software-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: ai_software_engineering
      - key: SECRET_KEY
        generateValue: true
